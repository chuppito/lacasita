name: lacasita
description: "Application d'aide à la commande pour la pizzeria La Casita"
publish_to: 'none'

version: 1.0.7+7

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  cupertino_icons: ^1.0.8
  provider: ^6.1.2
  url_launcher: ^6.3.1
  qr_flutter: ^4.1.0
  shared_preferences: ^2.3.0
  http: ^1.2.1
  csv: ^6.0.0
  mobile_scanner: ^7.2.0
  cloud_firestore: ^6.5.0
  firebase_core: ^4.10.0
  firebase_messaging: ^16.3.0
  flutter_local_notifications: ^19.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/icon_foreground.png"
  adaptive_icon_background: "#F06292"
  adaptive_icon_foreground: "assets/icon/icon_foreground.png"

flutter:
  uses-material-design: true